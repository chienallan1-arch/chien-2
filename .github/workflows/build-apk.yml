name: Build LINE Auto Recorder APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Self-Contained Android Project & Build APK
        run: |
          rm -rf build_workspace
          mkdir -p build_workspace/app/src/main/java/com/example/lineautorecorder
          cd build_workspace

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LineAutoRecorder"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.lineautorecorder'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.lineautorecorder"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <queries>
                  <package android:name="jp.naver.line.android" />
                  <package android:name="com.android.soundrecorder" />
              </queries>
              <application
                  android:allowBackup="false"
                  android:label="LINE 通話錄音"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LineCallMonitorService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/lineautorecorder/MainActivity.kt
          package com.example.lineautorecorder

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var btnAuth: Button
              private lateinit var title: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B0F17"))
                      setPadding(64, 96, 64, 64)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  title = TextView(this).apply {
                      text = "LINE 通話錄音 (診斷版)"
                      textSize = 22f
                      setTextColor(Color.parseColor("#06C755"))
                  }
                  val desc = TextView(this).apply {
                      text = "\n• 狀態：背景監聽服務待命中\n• 觸發條件：LINE 接通滿 3 秒自動開始錄音\n• 停止條件：LINE 掛斷立即停止並存檔\n• 儲存位置：MIUI/sound_recorder/app_rec/\n• 隱私安全：本 App 無網路權限，不讀取訊息內容\n"
                      textSize = 14f
                      setTextColor(Color.parseColor("#E2E8F0"))
                  }
                  btnAuth = Button(this).apply {
                      text = "檢查/開啟「通知存取權限」"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      }
                  }
                  val hint = TextView(this).apply {
                      text = "※ 若開關反灰顯示「受限設定」，請至手機設定 > 應用程式 > 本App > 點右上角「允許受限設定」即可解鎖。"
                      textSize = 12f
                      setTextColor(Color.parseColor("#EF4444"))
                      setPadding(0, 32, 0, 0)
                  }
                  layout.addView(title)
                  layout.addView(desc)
                  layout.addView(btnAuth)
                  layout.addView(hint)
                  setContentView(layout)
              }

              override fun onResume() {
                  super.onResume()
                  val listeners = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  val isGranted = listeners != null && listeners.contains(packageName)
                  if (isGranted) {
                      title.text = "✅ 服務已啟動，背景待命中"
                      title.setTextColor(Color.parseColor("#06C755"))
                      btnAuth.text = "權限已開啟 (點此重新檢查)"
                      btnAuth.setTextColor(Color.parseColor("#94a3b8"))
                  } else {
                      title.text = "❌ 請先開啟通知權限"
                      title.setTextColor(Color.parseColor("#EF4444"))
                      btnAuth.text = "點此開啟「通知存取權限」"
                      btnAuth.setTextColor(Color.BLACK)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/lineautorecorder/LineCallMonitorService.kt
          package com.example.lineautorecorder

          import android.app.Notification
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.media.MediaRecorder
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.widget.Toast
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class LineCallMonitorService : NotificationListenerService() {
              private lateinit var audioManager: AudioManager
              private val handler = Handler(Looper.getMainLooper())
              private var isLineCallActive = false
              private var isRecording = false
              private var fallbackRecorder: MediaRecorder? = null

              private val startRecordRunnable = Runnable {
                  if (isLineCallActive && !isRecording && isInVoipCallMode()) {
                      startXiaomiAppRecOrFallback()
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn?.packageName != "jp.naver.line.android") return
                  val category = sbn.notification.category
                  val isOngoing = (sbn.notification.flags and Notification.FLAG_ONGOING_EVENT) != 0
                  
                  if (category == Notification.CATEGORY_CALL) {
                      if (!isLineCallActive && isOngoing) {
                          handler.post { Toast.makeText(applicationContext, "【錄音助手】偵測到 LINE 通話...", Toast.LENGTH_SHORT).show() }
                      }

                      if (!isLineCallActive && isInVoipCallMode()) {
                          isLineCallActive = true
                          handler.post { Toast.makeText(applicationContext, "【錄音助手】已接通！倒數 3 秒啟動...", Toast.LENGTH_SHORT).show() }
                          handler.removeCallbacks(startRecordRunnable)
                          handler.postDelayed(startRecordRunnable, 3000L)
                      }
                  }
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  if (sbn?.packageName != "jp.naver.line.android") return
                  if (isLineCallActive) {
                      isLineCallActive = false
                      handler.removeCallbacks(startRecordRunnable)
                      if (isRecording) {
                          stopXiaomiAppRec()
                      }
                  }
              }

              private fun isInVoipCallMode(): Boolean {
                  return audioManager.mode == AudioManager.MODE_IN_COMMUNICATION
              }

              private fun startXiaomiAppRecOrFallback() {
                  isRecording = true
                  
                  try {
                      val intent = Intent("com.android.soundrecorder.START_APP_RECORD").apply {
                          component = ComponentName("com.android.soundrecorder", "com.android.soundrecorder.RecorderService")
                          putExtra("package_name", "jp.naver.line.android")
                          putExtra("audio_source", MediaRecorder.AudioSource.VOICE_COMMUNICATION)
                      }
                      startService(intent)
                      handler.post { Toast.makeText(applicationContext, "【錄音助手】已喚醒小米錄音機", Toast.LENGTH_SHORT).show() }
                  } catch (e: Exception) {
                      startDirectMiuiFolderRecorder()
                  }
              }

              private fun startDirectMiuiFolderRecorder() {
                  handler.post { Toast.makeText(applicationContext, "【錄音助手】啟用備用錄音引擎", Toast.LENGTH_LONG).show() }
                  
                  val dir = getExternalFilesDir(Environment.DIRECTORY_MUSIC)
                  if (dir != null && !dir.exists()) dir.mkdirs()
                  
                  val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())
                  val outFile = File(dir, "LINE_${stamp}.m4a")
                  
                  try {
                      fallbackRecorder = MediaRecorder().apply {
                          setAudioSource(MediaRecorder.AudioSource.VOICE_COMMUNICATION)
                          setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                          setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                          setAudioEncodingBitRate(128000)
                          setAudioSamplingRate(44100)
                          setOutputFile(outFile.absolutePath)
                          prepare()
                          start()
                      }
                  } catch (e: Exception) {
                      handler.post { Toast.makeText(applicationContext, "【錄音助手】備用錄音失敗", Toast.LENGTH_LONG).show() }
                  }
              }

              private fun stopXiaomiAppRec() {
                  isRecording = false
                  handler.post { Toast.makeText(applicationContext, "【錄音助手】通話結束，停止錄音", Toast.LENGTH_SHORT).show() }
                  try {
                      val intent = Intent("com.android.soundrecorder.STOP_APP_RECORD").apply {
                          component = ComponentName("com.android.soundrecorder", "com.android.soundrecorder.RecorderService")
                      }
                      startService(intent)
                  } catch (_: Exception) {}
                  fallbackRecorder?.apply {
                      try { stop() } catch (_: Exception) {}
                      release()
                  }
                  fallbackRecorder = null
              }
          }
          EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build_workspace/app/build/outputs/apk/debug/app-debug.apk
